# SonarQube Cloud analysis (https://sonarcloud.io/project/overview?id=fatcat_cidrella).
# The scan runs in .github/workflows/sonar.yml, on a pull request to main and
# on demand, after tests that write the lcov coverage it reads. It is not a
# required check.

sonar.organization=fatcat
sonar.projectKey=fatcat_cidrella
sonar.projectName=CIDRella
sonar.sourceEncoding=UTF-8

# Shipped code: the server, the anomaly sidecar, the client and the scripts.
sonar.sources=server/src,server/anomaly,client/src,scripts
sonar.tests=server/tests,client/tests,server/anomaly/tests

# The sidecar's tests sit inside its source directory, and a file may be
# indexed once. country-geo.js is generated (scripts/gen-country-geo.js).
# Migrations are SQLite that Sonar reads as PL/SQL and cannot parse, and they
# are append-only, so a finding in one could never be fixed.
sonar.exclusions=server/anomaly/tests/**,**/__pycache__/**,client/src/utils/country-geo.js,server/src/db/migrations/**

sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
sonar.python.version=3.13

# Rules switched off, each after reading what it flagged in the first full
# scan (2026-10-25). Off where every finding was noise or a false positive
# here, scoped to a path where the rule is useful elsewhere.
#   e1  shelldre:S7688            [[ ]] over [ ]: style; the scripts are bash or POSIX by intent.
#   e2  javascript:S7773          Number.parseInt over parseInt: style.
#   e3  javascript:S1313          hardcoded IP addresses: this is an IPAM.
#   e4  javascript:S4036          commands found on PATH: the services run with
#                                 systemd's or the image's fixed, root-owned PATH.
#   e5  Web:S6853                 label and control association, and
#   e6  Web:InputWithoutLabelCheck  input without a label: the scanner cannot see
#                                 that a PrimeVue component renders the input, so
#                                 most findings were wrong. Labeling is UI work.
#   e7  Web:S6840                 autocomplete values: the flagged ones are correct.
#   e8  javascript:S2871          sort() without a comparator: every one sorts strings.
#   e9  shell:S6505               npm without --ignore-scripts in the release
#                                 build: native modules need their install scripts.
#   e10 javascript:S905           bare expressions in the client: Vue components
#                                 read a reactive value on purpose to track it.
#   e11 javascript:S2187          "no tests in file" on the backend contract test
#                                 files, which register their tests from a shared module.
#   e12 javascript:S8786          regex backtracking in scripts/: build tools reading repo files.
#   e13 jssecurity:S8689          and
#   e14 jssecurity:S8707          log disclosure and path traversal in scripts/: the
#                                 maintainer's own release tools and arguments.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14
sonar.issue.ignore.multicriteria.e1.ruleKey=shelldre:S7688
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S7773
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S1313
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*
sonar.issue.ignore.multicriteria.e5.ruleKey=Web:S6853
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*
sonar.issue.ignore.multicriteria.e6.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*
sonar.issue.ignore.multicriteria.e7.ruleKey=Web:S6840
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*
sonar.issue.ignore.multicriteria.e8.ruleKey=javascript:S2871
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*
sonar.issue.ignore.multicriteria.e9.ruleKey=shell:S6505
sonar.issue.ignore.multicriteria.e9.resourceKey=**/*
sonar.issue.ignore.multicriteria.e10.ruleKey=javascript:S905
sonar.issue.ignore.multicriteria.e10.resourceKey=client/src/**/*
sonar.issue.ignore.multicriteria.e11.ruleKey=javascript:S2187
sonar.issue.ignore.multicriteria.e11.resourceKey=**/*contract.test.js
sonar.issue.ignore.multicriteria.e12.ruleKey=javascript:S8786
sonar.issue.ignore.multicriteria.e12.resourceKey=scripts/**/*
sonar.issue.ignore.multicriteria.e13.ruleKey=jssecurity:S8689
sonar.issue.ignore.multicriteria.e13.resourceKey=scripts/**/*
sonar.issue.ignore.multicriteria.e14.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.e14.resourceKey=scripts/**/*
