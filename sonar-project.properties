# SonarQube Cloud analysis (https://sonarcloud.io/project/overview?id=fatcat_cidrella).
# The scan runs in .github/workflows/ci.yml after the tests, which write the
# lcov coverage it reads. It is advisory: the scan never fails CI.

sonar.organization=fatcat
sonar.projectKey=fatcat_cidrella
sonar.projectName=CIDRella
sonar.sourceEncoding=UTF-8

# Shipped code: the server, the anomaly sidecar, the client and the scripts.
sonar.sources=server/src,server/anomaly,client/src,scripts
sonar.tests=server/tests,client/tests,server/anomaly/tests

# The sidecar's tests sit inside its source directory, and a file may be
# indexed once. country-geo.js is generated (scripts/gen-country-geo.js).
# Migrations are SQLite that Sonar reads as PL/SQL and cannot parse, and they
# are append-only, so a finding in one could never be fixed.
sonar.exclusions=server/anomaly/tests/**,**/__pycache__/**,client/src/utils/country-geo.js,server/src/db/migrations/**

sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
sonar.python.version=3.13
