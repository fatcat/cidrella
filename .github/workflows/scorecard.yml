name: OpenSSF Scorecard

# Grades the repository's supply-chain practices (branch protection, pinned
# dependencies, signed releases, CI tests and more), publishes the result for
# the README badge at scorecard.dev, and files the findings under Security >
# Code scanning. Publishing restricts this workflow: no top-level env or
# defaults, and only the actions below.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the findings to code scanning.
      security-events: write
      # Publish the result to the public Scorecard API, for the badge.
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
