name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly sweep so new CodeQL queries get applied even without pushes.
    - cron: "41 4 * * 2"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Taint-flow queries for the things the live injection tester probes
          # episodically. This runs on every push.
          - language: javascript-typescript
            queries: security-and-quality
          # server/anomaly (anomaly-detection sidecar)
          - language: python
            queries: security-and-quality
          # Workflow files themselves (untrusted-input/injection patterns).
          - language: actions
            queries: security-extended
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: ${{ matrix.queries }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
