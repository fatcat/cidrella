name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly sweep so new CodeQL queries get applied even without pushes.
    - cron: "41 4 * * 2"

# Read-only by default; the job below asks for what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Taint-flow queries for the things the live injection tester probes
          # episodically. This runs on every push.
          - language: javascript-typescript
            queries: security-and-quality
          # server/anomaly (anomaly-detection sidecar)
          - language: python
            queries: security-and-quality
          # Workflow files themselves (untrusted-input/injection patterns).
          - language: actions
            queries: security-extended
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: ${{ matrix.queries }}

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
