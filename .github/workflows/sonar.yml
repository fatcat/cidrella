name: SonarQube

# SonarQube Cloud analysis, project fatcat_cidrella (settings in
# sonar-project.properties). Not on every push: a dev branch takes many small
# commits, and the scan adds minutes. It runs on a pull request to main, which
# is how a release line reaches main, and on demand from the Actions tab (Run
# workflow, any branch). Not a required check: a failed scan shows here and
# blocks nothing.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: SonarQube Cloud reads blame to tell new code from old.
          fetch-depth: 0

      - name: Token check
        # Dependabot and fork pull requests get no Actions secrets, so the scan
        # is skipped there rather than failing. The token is only ever in the
        # env of this step and the scan, never of npm or the tests.
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "scan=$([ -n "$SONAR_TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.sonar.outputs.scan == 'yes'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        # --ignore-scripts for the reason given in ci.yml.
        if: steps.sonar.outputs.scan == 'yes'
        run: |
          npm ci --ignore-scripts
          npm ci --prefix server --ignore-scripts
          npm ci --prefix client --ignore-scripts

      # Each writes its package's coverage/lcov.info for the scan. A failing
      # test is CI's to report; the scan still runs on whatever coverage was
      # written, so one suite failing does not cost the other its report.
      - name: Server tests with coverage
        if: steps.sonar.outputs.scan == 'yes'
        continue-on-error: true
        run: npm run test:server -- --coverage

      - name: Client tests with coverage
        if: steps.sonar.outputs.scan == 'yes'
        continue-on-error: true
        run: npm run test:client -- --coverage

      - name: Scan
        if: steps.sonar.outputs.scan == 'yes'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # The JavaScript security (taint) analysis ran out of the default
          # heap, a quarter of the runner's 16 GB, on the first scan
          # (2026-10-25). Half of it leaves room for the rest of the runner.
          SONAR_SCANNER_JAVA_OPTS: -Xmx8g
        with:
          args: -Dsonar.projectVersion=${{ steps.sonar.outputs.version }}
