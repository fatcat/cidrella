name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Checkout + status reporting only. No writes to the repo or releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24 = the production target (bundled runtime in release tarballs).
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        # --ignore-scripts: no dependency lifecycle hook runs in CI. This is the
        # vector the September 2025 npm attacks used (Shai-Hulud shipped a
        # credential stealer in a postinstall hook), and CI holds a token.
        # Verified safe: no package in any of the three trees, dev or prod,
        # declares preinstall/install/postinstall. build-release.sh enforces
        # this invariant for the production tree via check-install-scripts.js.
        run: |
          npm ci --ignore-scripts
          npm ci --prefix server --ignore-scripts
          npm ci --prefix client --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Server tests
        run: npm run test:server

      - name: Client tests
        run: npm run test:client

      - name: Client production build
        run: npm run build:client

      - name: Release guards
        # Same guards build-release.sh runs, catching version/notes drift and
        # broken release plumbing on every push, not just at release time.
        run: node scripts/check-release-version.js .

      - name: Circular dependency check (server)
        # Baseline = 1 known cycle: utils/dhcp.js → models/dhcp-lease.js →
        # utils/after-commit.js → utils/dhcp.js. That one is a deliberate
        # hook-registry pattern (imports only invoked at runtime; safe under
        # ESM live bindings). Breaking it means inverting to runtime
        # registration, tracked as a future refactor. This gate fails only
        # when a NEW cycle appears. madge can't parse Vue SFCs, so client/
        # is out of scope here.
        run: |
          COUNT=$(npx -y madge --circular --extensions js --json server/src | jq 'length')
          echo "Circular dependency chains: $COUNT (baseline: 1)"
          if [ "$COUNT" -gt 1 ]; then
            npx -y madge --circular --extensions js server/src
            echo "New circular dependency introduced, see chains above."
            exit 1
          fi
