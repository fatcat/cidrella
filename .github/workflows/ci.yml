name: CI

on:
  push:
    # dev/** covers the release-line branches (dev/0.4.17 and successors) so
    # work there gets the same gates as main instead of only at PR time. A
    # pattern rather than a literal branch name, or this needs editing every
    # release. Spike branches are deliberately excluded: they are throwaway.
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Checkout + status reporting only. No writes to the repo or releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: SonarQube Cloud reads blame to tell new code from old.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 = the production target (bundled runtime in release tarballs).
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        # --ignore-scripts: no dependency lifecycle hook runs in CI. This is the
        # vector the September 2025 npm attacks used (Shai-Hulud shipped a
        # credential stealer in a postinstall hook), and CI holds a token.
        # Verified safe: no package in any of the three trees, dev or prod,
        # declares preinstall/install/postinstall. build-release.sh enforces
        # this invariant for the production tree via check-install-scripts.js.
        run: |
          npm ci --ignore-scripts
          npm ci --prefix server --ignore-scripts
          npm ci --prefix client --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Server tests
        # --coverage writes server/coverage/lcov.info for the SonarQube scan.
        run: npm run test:server -- --coverage

      - name: Client tests
        run: npm run test:client -- --coverage

      - name: Anomaly sidecar tests
        # Plain unittest over stdlib-only rule code (threat shape). The runner
        # image ships python3; no venv, no third-party packages, so the model
        # training path with sklearn stays out of CI on purpose.
        run: npm run test:sidecar

      - name: Client production build
        run: npm run build:client

      - name: Release guards
        # Same guards build-release.sh runs, catching version/notes drift and
        # broken release plumbing on every push, not just at release time.
        run: node scripts/check-release-version.js .

      - name: Circular dependency check (server)
        # Baseline = 0. The last cycle (services/backend-apply.js ->
        # models/dhcp-lease.js -> utils/after-commit.js) went in 0.5.1, when
        # after-commit stopped importing the hook handlers and index.js began
        # registering them at boot. Any cycle fails the gate. madge can't
        # parse Vue SFCs, so client/ has its own check,
        # scripts/check-client-cycles.js, run by `npm run lint` above.
        #
        # Only static imports count. The repo-root .madgerc sets
        # skipAsyncImports, so a lazy `await import()` inside a function body
        # (db/init.js reaching for subnet-topology at startup) is not an edge.
        # Those resolve after module evaluation and cannot deadlock loading,
        # which is the failure this gate exists to catch. Without that
        # setting the same lazy import fanned out into eight chains and the
        # gate had been red since 2026-09-07 with no real cycle behind it.
        run: |
          COUNT=$(npx -y madge --circular --extensions js --json server/src | jq 'length')
          echo "Circular dependency chains: $COUNT (baseline: 0)"
          if [ "$COUNT" -gt 0 ]; then
            npx -y madge --circular --extensions js server/src
            echo "New circular dependency introduced, see chains above."
            exit 1
          fi

      - name: Reuse guards
        # Byte-identical scoped CSS rules in two components, and confirmation
        # dialogs hand-built instead of the shared one. Both baselined like
        # the gates below, so they fail only on NEW instances. The three
        # ESLint reuse rules (vendor imports through src/ui, form controls
        # through the wrappers, status marks through StatusDot/StatusBadge)
        # ran in the Lint step above.
        run: |
          node scripts/check-scoped-css-dupes.js
          node scripts/check-confirm-dialogs.js

      - name: Duplicate-export check
        # Fails when a file hand-rolls a function that a module it already
        # imports from also exports. That is the shape utils/validation.js was
        # extracted to end, and two route files went on to redefine
        # isIntInRange anyway. Baselined like the madge gate above: known-open
        # cases are listed in the script with their REVIEW.md finding number,
        # so this fires only on NEW duplication. Namespace imports are exempt,
        # since a local wrapper delegating to Namespace.fn() is deliberate.
        run: node scripts/check-duplicate-exports.js .

      - name: SonarQube Cloud setup
        # Dependabot and fork pull requests get no Actions secrets, so the scan
        # is skipped there rather than failing. The token is only ever in the
        # env of this step and the scan, never of npm or the tests.
        id: sonar
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "scan=$([ -n "$SONAR_TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: SonarQube Cloud scan
        # Advisory: findings and the quality gate show on sonarcloud.io and the
        # pull request, and a failed scan never fails CI. Runs after a failed
        # gate above too, so a red build still gets its analysis. Settings are
        # in sonar-project.properties.
        if: always() && steps.sonar.outputs.scan == 'yes'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # The JavaScript security (taint) analysis ran out of the default
          # heap, a quarter of the runner's 16 GB, on the first scan
          # (2026-10-25). Half of it leaves room for the rest of the runner.
          SONAR_SCANNER_JAVA_OPTS: -Xmx8g
        with:
          args: -Dsonar.projectVersion=${{ steps.sonar.outputs.version }}

  docker:
    # The image went unbuilt for months and stopped building twice over
    # (fixed 2026-10-07): Alpine moved arping into iputils, and the client
    # began importing server/src. Building it on every push keeps that from
    # happening quietly again. Nothing is pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t cidrella:ci .

      - name: Smoke check
        # The binaries the app runs as cidrella carry the capabilities they
        # need (a missing one fails only at runtime), and Kea is there.
        run: |
          docker run --rm --entrypoint sh cidrella:ci -c '
            set -e
            getcap /usr/sbin/arping | grep -q cap_net_raw
            getcap /usr/sbin/kea-dhcp4 | grep -q cap_net_bind_service
            getcap /usr/sbin/kea-dhcp6 | grep -q cap_net_bind_service
            kea-dhcp4 -V >/dev/null
            test -f /app/client/dist/index.html
            node -e "require(\"/app/server/node_modules/better-sqlite3\")"
          '
