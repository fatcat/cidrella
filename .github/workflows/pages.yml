name: Pages

# Publishes the landing page at https://fatcat.github.io/cidrella/. The page
# lives in site/; its screenshots, logo and favicons are symlinks to where the
# app and README already keep them, so they are not stored twice and the page
# also works opened straight from a checkout. cp -L copies what they point at.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/screenshots/*.png'
      - 'client/public/logo-text.png'
      - 'client/public/favicon*'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble the site
        run: |
          # Only the page's own file types are published, never whatever else
          # sits in docs/screenshots (notes, an editor's temp copy of an image).
          mkdir -p _site/screenshots
          find site -maxdepth 1 -type f -exec cp {} _site/ \;
          cp -L site/logo-text.png site/favicon.ico site/favicon-32x32.png _site/
          cp -L site/screenshots/*.png _site/screenshots/

      # /virustotal/ is a stable address for the README badge: a redirect to
      # VirusTotal's report on the latest release's tarball, found by its
      # SHA-256. virustotal.yml rebuilds the site after each scan, so the
      # redirect moves to a new release without a commit.
      - name: Point /virustotal/ at the latest release's report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.assets[] | select(.name | endswith(".tar.gz")) | [.name, (.digest // ""), .browser_download_url] | @tsv' | head -1) || asset=''
          IFS=$'\t' read -r name digest url <<< "$asset"
          sha=${digest#sha256:}
          if ! [[ $sha =~ ^[0-9a-f]{64}$ ]] && [ -n "$url" ]; then
            sha=$(curl -sSfL "$url" | sha256sum | cut -c1-64) || sha=''
          fi
          if [[ $sha =~ ^[0-9a-f]{64}$ ]]; then
            report="https://www.virustotal.com/gui/file/$sha"
          else
            # No tarball to name: send the badge to the release page, where
            # the scan link would be, rather than fail the whole deploy.
            name='the latest release'
            report="https://github.com/$GITHUB_REPOSITORY/releases/latest"
            echo '::warning::No release tarball found; /virustotal/ points at the releases page.'
          fi
          mkdir -p _site/virustotal
          cat > _site/virustotal/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=$report">
          <link rel="canonical" href="$report">
          <title>VirusTotal report for $name</title>
          </head>
          <body>
          <p>Going to the <a href="$report">VirusTotal report for $name</a>.</p>
          </body>
          </html>
          HTML
          echo "$name -> $report"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
